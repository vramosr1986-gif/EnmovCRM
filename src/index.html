<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title><?= title ?></title>
    <?!= include('styles'); ?>
  </head>
  <body>
    <div id="login-overlay" class="modal-overlay">
      <div class="modal-card login-card" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="modal-header">
          <h3 id="login-title">Iniciar sesion</h3>
        </div>
        <form id="login-form" onsubmit="return false">
          <div id="login-error" class="error-box" hidden></div>
          <div class="form-grid">
            <label for="login-username">Usuario</label>
            <input id="login-username" type="text" autocomplete="username">
            <label for="login-password">Contrasena</label>
            <input id="login-password" type="password" autocomplete="current-password">
          </div>
          <div class="modal-actions">
            <button id="login-submit" type="button" class="btn">Entrar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="app-content" hidden>
      <header class="hero">
        <div>
          <h1><?= title ?></h1>
          <p class="subtitle">Gestor central de clientes, sesiones y domiciliaciones · Usuario: <strong id="current-user-name"></strong></p>
        </div>
        <div class="hero-actions">
          <button id="btn-manage-users" class="btn secondary" type="button" hidden>Usuarios</button>
          <button id="btn-merge-pdfs" class="btn secondary" type="button" hidden>PDFs</button>
          <button id="btn-logout" class="btn secondary" type="button">Cerrar sesion</button>
        </div>
      </header>

      <main class="layout">
        <aside class="panel menu">
          <h2>Panel Asistencial</h2>
          <? for (var i = 0; i < apps.length; i++) { ?>
            <button data-app-id="<?= apps[i].id ?>" data-app-name="<?= apps[i].nombre ?>" data-allows-invoice="<?= apps[i].allowsInvoice ?>"><?= apps[i].nombre ?></button>
          <? } ?>
          <div id="calendar-box" class="calendar-box" hidden>
            <div class="calendar-head">
              <button id="cal-prev" type="button" class="btn ghost tiny" title="Mes anterior">&#8249;</button>
              <h3 id="cal-title">Calendario</h3>
              <button id="cal-next" type="button" class="btn ghost tiny" title="Mes siguiente">&#8250;</button>
            </div>
            <select id="cal-module-filter" class="btn secondary tiny" hidden></select>
            <div id="cal-grid" class="cal-grid"></div>
          </div>
        </aside>

        <section class="panel content">
          <div class="toolbar">
            <h2 id="current-module">Selecciona un modulo</h2>
            <div class="toolbar-actions">
              <button id="btn-new-row" class="btn secondary" type="button">Nuevo registro</button>
              <button id="btn-export-excel" class="btn secondary" type="button">Exportar Excel</button>
              <button id="btn-refresh" class="btn secondary" type="button">Actualizar</button>
            </div>
          </div>

          <div id="error-box" class="error-box" hidden></div>
          <div id="duplicates-box" class="duplicates-box" hidden></div>
          <div class="filters" id="filters-box">
            <div class="filter-item">
              <label for="filter-client">Cliente</label>
              <input id="filter-client" type="text" placeholder="Nombre del cliente">
            </div>
            <div class="filter-item">
              <label for="filter-month-from">Fecha desde</label>
              <input id="filter-month-from" type="date">
            </div>
            <div class="filter-item">
              <label for="filter-month-to">Fecha hasta</label>
              <input id="filter-month-to" type="date">
            </div>
            <div class="filter-item">
              <label for="filter-amount-min">Cantidad min</label>
              <input id="filter-amount-min" type="number" step="any" placeholder="0">
            </div>
            <div class="filter-item">
              <label for="filter-amount-max">Cantidad max</label>
              <input id="filter-amount-max" type="number" step="any" placeholder="1000">
            </div>
            <div class="filter-item">
              <label for="filter-payment">Como paga</label>
              <select id="filter-payment">
                <option value="">Todos</option>
                <option value="efectivo">Efectivo</option>
                <option value="tarjeta">Tarjeta</option>
                <option value="bono">Bono</option>
              </select>
            </div>
            <div class="filter-item">
              <label for="filter-search">Busqueda general</label>
              <input id="filter-search" type="text" placeholder="Texto libre en la fila">
            </div>
            <div class="filter-actions">
              <button id="btn-clear-filters" class="btn secondary" type="button">Limpiar filtros</button>
            </div>
          </div>
          <div id="summary-box" class="summary-box" hidden></div>
          <div class="table-wrap">
            <table id="tabla-modulo"></table>
          </div>
        </section>
      </main>

      <div id="modal-overlay" class="modal-overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-header">
            <h3 id="modal-title">Editar registro</h3>
            <button id="modal-close" type="button" class="btn ghost">Cerrar</button>
          </div>
          <div id="modal-body" class="modal-body"></div>
          <div class="modal-actions">
            <button id="modal-cancel" type="button" class="btn secondary">Cancelar</button>
            <button id="modal-save" type="button" class="btn">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <script>
    window.__APP_PARAMS__ = {
      modulo: <?!= JSON.stringify(moduloParam) ?>,
      accion: <?!= JSON.stringify(accionParam) ?>
    };
    </script>
    <?!= include('client'); ?>
  </body>
</html>
